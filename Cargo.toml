[package]
name = "metadata"
version = "0.11.0"
authors = ["Kazakov Giorgi Vladimirovich", "Sidorov Roman Alexandrovich"]
edition = "2024"

[dependencies]
const_format = "0.2.36"
egui = { version = "0.36.2", optional = true }
egui-phosphor = { version = "0.14.0", optional = true }
egui-probe = "0.13.0"
egui_extras = { version = "0.36.2", features = [
    "datepicker",
    "serde",
], optional = true }
itertools = "0.15.0"
jiff = { version = "0.2.37", features = ["serde"] }
polars = { version = "=0.52.0", default-features = false, features = [
    "serde",
], optional = true }
ron = "0.12.2"
semver = { version = "1.0.28", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive", "std"] }
thiserror = "2.0.20"
tracing = "0.1.44"
typed-builder = "0.23.2"

egui_l10n = { git = "https://github.com/ippras/egui_l10n", branch = "egui-0.36", features = [
    "macros",
] }

[dev-dependencies]
eframe = "0.36.2"

[features]
default = ["egui", "polars"]
egui = ["dep:egui", "dep:egui-phosphor", "dep:egui_extras"]
polars = ["dep:polars"]
